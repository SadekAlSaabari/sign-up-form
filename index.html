<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign Up Form</title>
</head>
<body>
    <div id="left-container">
        <div id="odin-banner">
            <img id="odin-photo" src="pictures/odin.png">
            <p id="odin-text">ODIN</p>
        </div>

        <div id="image-credit-container">Photo by Alireza Najaf from&nbsp;<a href="https://www.pexels.com/photo/close-up-of-the-calico-cat-19580278/" target="blank">Pexels</a></div>
    </div>
    
    <div id="right-container">
        <div id="right-upper-text">
            This is not a real sign up service, but you can try to sign up if you want!
            <br><br>
            <em>"When a man loves cats, I am his friend and comrade, without further introduction."</em>
            <br>
            - Mark Twain
        </div>

        <div id="form-section">
            <form id="login-form">
                <legend>Let's do this!</legend>

                <div id="form-container">
                    <div id="form-left-part">
                        <label for="fname">FIRST NAME</label>
                        <input type="text" id="fname" name="fname" placeholder="First name here"><br>
                        
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" placeholder="test@mail.com"><br>

                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" placeholder="Password here"><br>
                    </div>

                    <div id="form-right-part">
                        <label for="lname">LAST NAME</label>
                        <input type="text" id="lname" name="lname" placeholder="Last name here"><br>      

                        <label for="number">PHONE NUMBER</label>
                        <input type="number" id="number" name="number" placeholder="Phone number here"><br>

                        <label for="cpassword">CONFIRM PASSWORD</label>
                        <input type="password" id="cpassword" name="cpassword" placeholder="Confirm password"><br>
                    </div>
                </div>
            </form>
        </div>

        <div id="button-section">
            <button type="submit" form="login-form" id="submit-button">Create Account</button>
        </div>
    </div>
</body>
</html
