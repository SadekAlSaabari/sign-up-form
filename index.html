<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="signupScript.js" defer></script>

    <title>Sign Up Form</title>
    <link rel="icon" type="image/x-icon" href="pictures/odin-icon.png">
</head>

<body>
    <div id="left-container">
        <div id="odin-banner">
            <img id="odin-photo" src="pictures/odin.png">
            <p id="odin-text">ODIN</p>
        </div>

        <div id="image-credit-container">Photo by Alireza Najaf from&nbsp;<a href="https://www.pexels.com/photo/close-up-of-the-calico-cat-19580278/" target="blank">Pexels</a></div>
    </div>
    
    <div id="right-container">
        <div id="right-upper-text">
            This is not a real sign up service, but you can try to sign up if you want!
            <br><br>
            <em>"When a man loves cats, I am his friend and comrade, without further introduction."</em>
            <br>
            - Mark Twain
        </div>

        <div id="form-section">
            <form id="signup-form">
                <legend>Let's do this!</legend>

                <div id="form-container">
                    <div id="form-left-part">
                        <label for="fname">FIRST NAME</label>
                        <input type="text" id="fname" name="fname" placeholder="First name here" required><br>
                        
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" placeholder="test@mail.com" required><br>

                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" placeholder="Password here" required><br>
                    </div>

                    <div id="form-right-part">
                        <label for="lname">LAST NAME</label>
                        <input type="text" id="lname" name="lname" placeholder="Last name here" required><br>      

                        <label for="number">PHONE NUMBER</label>
                        <input type="number" id="number" name="number" placeholder="Phone number here" required><br>

                        <label for="cpassword">CONFIRM PASSWORD</label>
                        <input type="password" id="cpassword" name="cpassword" placeholder="Confirm password" required><br>
                    </div>
                </div>
            </form>
        </div>

        <script>
            const password = document.getElementById("password");
            const cPassword = document.getElementById("cpassword");

            function passwordMatch() {
                if (password.value != cPassword.value) {
                    cPassword.setCustomValidity("Make sure your passwords match.");
                } else {
                    cPassword.setCustomValidity("");
                }
            }

            password.addEventListener('change', passwordMatch);
            cPassword.addEventListener('keyup', passwordMatch);
        </script>

        <div id="button-section">
            <button type="submit" form="signup-form" id="signup-button">Create Account</button>

            <p>Already have an account?&nbsp;<a id="login-link" href="login-page.html">Login</a></p>
        </div>
    </div>
</body>
</html
