<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login-style.css">
    <script src="loginScript.js" defer></script>

    <title>Sign Up Form</title>
    <link rel="icon" type="image/x-icon" href="pictures/odin-icon.png">
</head>
<body>
    <div id="left-container">
        <div id="odin-banner">
            <img id="odin-photo" src="pictures/odin.png">
            <p id="odin-text">ODIN</p>
        </div>

        <div id="image-credit-container">Photo by Alireza Najaf from&nbsp;<a href="https://www.pexels.com/photo/close-up-of-the-calico-cat-19580278/" target="blank">Pexels</a></div>
    </div>
    
    <div id="right-container">
        <div id="right-upper-text">
            This is not a real sign up service, but you can try to sign up if you want!
            <br><br>
            <em>"When a man loves cats, I am his friend and comrade, without further introduction."</em>
            <br>
            - Mark Twain
        </div>

        <div id="form-section">
            <form id="login-form">
                <legend>Welcome back!</legend>

                <div id="form-container">
                    <div id="form-left-part">
                        <label for="login-email">EMAIL</label>
                        <input type="email" id="login-email" name="email" placeholder="test@mail.com" required><br>
                    </div>

                    <div id="form-right-part">
                        <label for="login-password">PASSWORD</label>
                        <input type="password" id="login-password" name="password" placeholder="Password here" required><br>
                    </div>
                </div>
            </form>
        </div>

        <div id="button-section">
            <button type="submit" form="login-form" id="login-button">Login</button>

            <p>Not registered yet?&nbsp;<a id="login-link" href="Index.html">Sign up</a></p>
        </div>
    </div>
</body>
</html
